[package]
name = "git-status"
version = "1.6.0"
edition = "2021"
description = "Per-space git working-tree status in the herdr sidebar (agents panel on stock herdr; spaces card on patched builds)."
license = "MIT"

# Binary target inherits the package name => target/release/git-status,
# which is what herdr-plugin.toml's commands point at.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unix-only: SIGINT/SIGTERM shutdown plumbing and setsid/kill/localtime_r.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

# Windows-only: the Win32 calls standing in for the Unix process/console/time
# APIs above. (The socket itself needs no crate — herdr's Windows build listens
# on a named pipe, which std opens as a duplex File; see src/herdr.rs.)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
